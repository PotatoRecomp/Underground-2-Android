# Recompiler input for default.xbe (Need for Speed: Underground 2, original Xbox USA, title 4541005A),
# written by xbe_symbols, the names it missed resolved by hand at the top of [symbols]

[xbe]
path = "assets/default.xbe"
title = 0x4541005A
entry = 0x21B1CE
xdk = 5849
out = "generated/game"
partitions = 128
code_sections = [".text", "D3D", "XGRPH", "XNET", "XONLINE", "DSOUND", "XPP"]

# extra entry points
[functions]

# functions the host replaces or calls by name, 0 where the image has none
[symbols]
# resolved by hand (xbe_symbols' signatures lack them), each matched to Most Wanted's (same XDK 5849 library)
# Reset: waits for idle, frees the frame buffers (0x2EDCD0) and makes them again (0x2EDE00), ret 4
D3DDevice_Reset                                      = 0x2E9820
# stores [stage] at CDevice + 0xF98 (CDevice_Palettes)
D3DDevice_SetPalette                                 = 0x2EA2D0
# BeginPush flushes the lazy state and makes room for count + 1 dwords, EndPush stores the end at CDevice + 0
D3DDevice_BeginPush                                  = 0x2E8D10
D3DDevice_EndPush                                    = 0x2E8D30
# copies a program (word count at +2) to the device's mirror and pushes NV097 0x1E9C/0x0B00
D3DDevice_LoadVertexShaderProgram                    = 0x2E83B0
# the FIFO's get and put of the miniport (CDevice + 0x934) differ: the GPU is busy
D3DDevice_IsBusy                                     = 0x2EA3F0
# visibility test: begin pushes NV097 0x17C8, end makes the report slot at CDevice + 0x7D4, the result reads it
D3DDevice_BeginVisibilityTest                        = 0x2EA420
D3DDevice_EndVisibilityTest                          = 0x2EA4C0
D3DDevice_GetVisibilityTestResult                    = 0x2E9550
# DirectSound exports the signatures lack, by their .XTLID ids (B0057, B0067) in the library's alphabetical order
